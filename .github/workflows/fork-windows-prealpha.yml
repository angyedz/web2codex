name: Web2Codex Windows pre-alpha

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web2codex-prealpha-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    name: Build Windows x64 pre-alpha
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        working-directory: codex-rs
    env:
      CODEX_REPO_ROOT: ${{ github.workspace }}
      CODEX_GITHUB_REPOSITORY: ${{ github.repository }}
      TARGET: x86_64-pc-windows-msvc
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_BUILD_JOBS: "4"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_PROFILE_RELEASE_LTO: "false"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          target: x86_64-pc-windows-msvc

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Configure short Cargo home
        shell: pwsh
        run: |
          $cargoHome = Join-Path $env:SystemDrive "c"
          New-Item -ItemType Directory -Force -Path $cargoHome | Out-Null
          "CARGO_HOME=$cargoHome" >> $env:GITHUB_ENV
          git config --global core.longpaths true

      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          workspaces: codex-rs -> target

      - name: Configure verified Rusty V8 artifacts
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-pc-windows-msvc

      - name: Verify browser automation scripts
        run: node --test web-browser/tests/*.test.cjs

      - name: Compile the CLI, WebView, and packaged harness helpers
        run: cargo build --locked --release --target x86_64-pc-windows-msvc -p codex-cli --bin web2codex -p codex-web-browser --bin codex-web-browser -p codex-code-mode-host --bin codex-code-mode-host -p codex-app-server --bin exec-server -p codex-windows-sandbox --bin codex-command-runner --bin codex-windows-sandbox-setup

      - name: Verify native MCP bridge
        run: cargo test --locked --release --target x86_64-pc-windows-msvc -p codex-web-browser --bin codex-web-browser

      - name: Assemble complete Windows harness package
        shell: pwsh
        run: |
          $package = Join-Path $env:RUNNER_TEMP "codex-package-$env:TARGET"
          python ..\scripts\build_codex_package.py `
            --target $env:TARGET `
            --variant web2codex `
            --package-version "0.1.0-prealpha.$env:GITHUB_RUN_NUMBER" `
            --cargo-profile release `
            --package-dir $package `
            --entrypoint-bin "target/$env:TARGET/release/web2codex.exe" `
            --code-mode-host-bin "target/$env:TARGET/release/codex-code-mode-host.exe" `
            --exec-server-bin "target/$env:TARGET/release/exec-server.exe" `
            --codex-command-runner-bin "target/$env:TARGET/release/codex-command-runner.exe" `
            --codex-windows-sandbox-setup-bin "target/$env:TARGET/release/codex-windows-sandbox-setup.exe" `
            --web-browser-bin "target/$env:TARGET/release/codex-web-browser.exe" `
            --force
          if ($LASTEXITCODE -ne 0) { throw "Failed to assemble the complete Windows harness package" }

      - name: Upload complete Windows x64 pre-alpha package
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: web2codex-prealpha-windows-x64
          path: |
            ${{ runner.temp }}/codex-package-${{ env.TARGET }}/
          if-no-files-found: error
          retention-days: 3
