name: postmerge-ci

# Manual rerun of the public cross-platform build when maintainers need it.
on:
  workflow_dispatch:

jobs:
  fork-cross-platform:
    name: Fork cross-platform build
    uses: ./.github/workflows/fork-cross-platform.yml
    secrets: inherit

  results:
    name: Postmerge CI results
    needs:
      - fork-cross-platform
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      # Check the selected commit so this helper matches the workflow revision.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Require successful dependencies
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/check_ci_results.py
