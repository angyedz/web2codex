name: Fork cross-platform build

on:
  workflow_call:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fork-cross-platform.yml"
      - ".github/workflows/fork-release.yml"
      - ".github/actions/setup-rusty-v8/**"
      - ".github/scripts/**"
      - "codex-rs/**"
      - "scripts/build_codex_package.py"
      - "scripts/install/**"
  pull_request:
    paths:
      - ".github/workflows/fork-cross-platform.yml"
      - ".github/workflows/fork-release.yml"
      - ".github/actions/setup-rusty-v8/**"
      - ".github/scripts/**"
      - "codex-rs/**"
      - "scripts/build_codex_package.py"
      - "scripts/install/**"

permissions:
  contents: read

concurrency:
  group: fork-cross-platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli-build:
    name: CLI build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    defaults:
      run:
        working-directory: codex-rs
    env:
      CODEX_GITHUB_REPOSITORY: ${{ github.repository }}
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      # The standard ARM macOS runner has 7 GB RAM and 14 GB storage.
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_PROFILE_RELEASE_LTO: "false"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: 1.95.0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Configure short Cargo home (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cargoHome = Join-Path $env:SystemDrive "c"
          New-Item -ItemType Directory -Force -Path $cargoHome | Out-Null
          "CARGO_HOME=$cargoHome" >> $env:GITHUB_ENV
          git config --global core.longpaths true

      - name: Install Linux WebKitGTK build libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes build-essential pkg-config libcap-dev libasound2-dev libgtk-3-dev libwebkit2gtk-4.1-dev libxdo-dev

      - name: Configure verified Rusty V8 artifacts
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          workspaces: codex-rs -> target

      - name: Compile the fork's CLI
        run: cargo build --locked --release -p codex-cli --bin codex

      - name: Compile the private WebView browser
        run: cargo build --locked --release -p codex-web-browser --bin codex-web-browser

      - name: Smoke-test the CLI on this runner (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          test -x target/release/codex-web-browser
          target/release/codex --version
          target/release/codex web --help >/dev/null

      - name: Smoke-test the CLI on this runner (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cli = Join-Path $PWD "target/release/codex.exe"
          $browser = Join-Path $PWD "target/release/codex-web-browser.exe"
          if (-not (Test-Path -LiteralPath $cli -PathType Leaf)) { throw "Missing packaged CLI: $cli" }
          if (-not (Test-Path -LiteralPath $browser -PathType Leaf)) { throw "Missing WebView browser: $browser" }
          & $cli --version
          if ($LASTEXITCODE -ne 0) { throw "codex --version failed with exit code $LASTEXITCODE" }
          & $cli web --help *> $null
          if ($LASTEXITCODE -ne 0) { throw "codex web --help failed with exit code $LASTEXITCODE" }
