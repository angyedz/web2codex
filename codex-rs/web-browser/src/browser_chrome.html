<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{color-scheme:dark;font:13px 'Segoe UI',sans-serif;background:#18191c;color:#e8e9ed}*{box-sizing:border-box}body{margin:0}.tabs{height:37px;display:flex;align-items:end;gap:4px;padding:4px 10px 0;border-bottom:1px solid #303136}.tab{display:flex;align-items:center;gap:8px;min-width:100px;max-width:210px;height:30px;padding:0 8px 0 12px;background:#24262a;border:0;border-radius:8px 8px 0 0;color:#b6bac4}.tab.active{background:#34363c;color:white}.tab span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;flex:1;text-align:left}.close{border:0;background:none;color:inherit;font-size:17px;cursor:pointer}.add,.nav{border:0;background:transparent;color:#d5d7dd;border-radius:6px;cursor:pointer;font-size:19px;width:34px;height:30px}.add:hover,.nav:hover,.close:hover{background:#41444c}.bar{height:45px;display:flex;align-items:center;gap:4px;padding:5px 10px;background:#24262a}.address{flex:1;height:32px;border:1px solid #3b3e46;background:#17181b;color:#f5f5f7;border-radius:8px;padding:0 12px;font:13px 'Segoe UI',sans-serif;outline:none}.address:focus{border-color:#84aaff;box-shadow:0 0 0 2px #84aaff40}.status{font-size:11px;color:#a8aebd;padding:0 8px;white-space:nowrap}.tab:focus-visible,.nav:focus-visible,.add:focus-visible{outline:2px solid #84aaff}
.tab .close{flex:0 0 auto;text-align:center;overflow:visible}
</style></head><body><div class="tabs" id="tabs" role="tablist" aria-label="Вкладки"></div><div class="bar"><button class="nav" title="Назад" aria-label="Назад" onclick="send('back')">&#8592;</button><button class="nav" title="Вперёд" aria-label="Вперёд" onclick="send('forward')">&#8594;</button><button class="nav" title="Обновить" aria-label="Обновить" onclick="send('reload')">&#8635;</button><input class="address" id="address" aria-label="Адрес" spellcheck="false" placeholder="Введите адрес или поисковый запрос"><span class="status">Web2Codex</span></div><script>
const address=document.getElementById('address'),tabs=document.getElementById('tabs');function send(action,extra={}){window.ipc.postMessage(JSON.stringify({action,...extra}))}address.addEventListener('keydown',e=>{if(e.key==='Enter'){send('navigate',{value:address.value});address.blur()}});window.setBrowserState=state=>{if(document.activeElement!==address)address.value=state.url||'';tabs.replaceChildren();state.tabs.forEach((label,index)=>{const tab=document.createElement('button');tab.className='tab'+(index===state.active?' active':'');tab.setAttribute('role','tab');tab.setAttribute('aria-selected',index===state.active);tab.title=label;const text=document.createElement('span');text.textContent=label;tab.append(text);tab.onclick=()=>send('select',{index});if(state.tabs.length>1){const close=document.createElement('span');close.className='close';close.textContent='×';close.title='Закрыть вкладку';close.onclick=e=>{e.stopPropagation();send('close',{index})};tab.append(close)}tabs.append(tab)});const add=document.createElement('button');add.className='add';add.title='Новая вкладка';add.setAttribute('aria-label','Новая вкладка');add.textContent='+';add.onclick=()=>send('new');tabs.append(add)};document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key.toLowerCase()==='l'){e.preventDefault();address.focus();address.select()}if(e.ctrlKey&&e.key.toLowerCase()==='t'){e.preventDefault();send('new')}});setInterval(()=>send('sync'),1000);send('sync');
</script></body></html>
